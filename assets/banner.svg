<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="failoverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="nodeActiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="nodeStandbyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.12" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pingStatus {
      0% { r: 5; opacity: 1; }
      100% { r: 16; opacity: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes heartbeat {
      0%, 100% { stroke-width: 2; opacity: 0.8; }
      50% { stroke-width: 3.5; opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
    }
    .orb-anim { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: center; }
    .flow-path { stroke-dasharray: 8 6; animation: flowLine 2s linear infinite; }
    .ping-ring { animation: pingStatus 2.2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    .float-1 { animation: floatCard 6s ease-in-out infinite; }
    .float-2 { animation: floatCard 7s ease-in-out infinite 1.5s; }
    .heartbeat-line { animation: heartbeat 2.5s ease-in-out infinite; }
    .banner-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .banner-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    .banner-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Glowing Orbs -->
  <circle cx="150" cy="80" r="140" fill="url(#glowGrad)" filter="url(#softGlow)" class="orb-anim" />
  <circle cx="1060" cy="340" r="160" fill="#6366f1" filter="url(#softGlow)" opacity="0.25" class="orb-anim" style="animation-delay: -3s;" />
  <circle cx="850" cy="100" r="100" fill="#06b6d4" filter="url(#softGlow)" opacity="0.2" class="orb-anim" style="animation-delay: -5s;" />

  <!-- Overlay Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Failover Network Diagram (Right Side / Background Accent) -->
  <g transform="translate(680, 50)" class="float-1">
    <!-- Outer Diagram Container -->
    <rect x="0" y="0" width="460" height="310" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" />

    <!-- Traffic Router / Global DNS Node -->
    <g transform="translate(60, 155)">
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)" />
      <text x="0" y="5" text-anchor="middle" fill="#38bdf8" class="banner-mono" font-size="12" font-weight="700">DNS/LB</text>
      <!-- Pulsing Active Ping -->
      <circle cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" class="ping-ring" />
    </g>

    <!-- Data Stream Lines -->
    <!-- Primary Active Route (to Cluster A) -->
    <path d="M 88 145 C 160 120, 200 80, 290 80" fill="none" stroke="#10b981" stroke-width="2.5" class="flow-path" />
    <!-- Standby / Failover Route (to Cluster B) -->
    <path d="M 88 165 C 160 190, 200 230, 290 230" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 4" class="flow-path" style="animation-duration: 3.5s;" />

    <!-- Health Check Heartbeat Trace in between -->
    <path d="M 120 155 L 150 155 L 160 135 L 170 175 L 180 150 L 190 160 L 220 155" fill="none" stroke="#10b981" class="heartbeat-line" />

    <!-- Cluster Primary (Region A) -->
    <g transform="translate(290, 45)">
      <rect x="0" y="0" width="145" height="70" rx="8" fill="#064e3b" fill-opacity="0.8" stroke="#10b981" stroke-width="1.8" />
      <circle cx="18" cy="22" r="5" fill="#10b981" />
      <circle cx="18" cy="22" r="9" fill="none" stroke="#10b981" stroke-width="1" class="ping-ring" />
      <text x="32" y="26" fill="#34d399" class="banner-title" font-size="13">Primary: US-East</text>
      <text x="18" y="48" fill="#a7f3d0" class="banner-mono" font-size="11">Status: HEALTHY</text>
      <text x="18" y="61" fill="#6ee7b7" class="banner-mono" font-size="9">Latency: 12ms • 99.99%</text>
    </g>

    <!-- Cluster Secondary / Failover Target (Region B) -->
    <g transform="translate(290, 195)">
      <rect x="0" y="0" width="145" height="70" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="18" cy="22" r="5" fill="#818cf8" />
      <text x="32" y="26" fill="#c7d2fe" class="banner-title" font-size="13">Standby: EU-West</text>
      <text x="18" y="48" fill="#a5b4fc" class="banner-mono" font-size="11">Status: READY (GSLB)</text>
      <text x="18" y="61" fill="#818cf8" class="banner-mono" font-size="9">Auto-Failover Active</text>
    </g>

    <!-- Chaos Injection Badge -->
    <g transform="translate(140, 265)">
      <rect x="0" y="0" width="170" height="26" rx="13" fill="#371b26" stroke="#f43f5e" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#f43f5e" />
      <text x="25" y="17" fill="#fda4af" class="banner-mono" font-size="10">⚡ Chaos Mesh / Krkn Tested</text>
    </g>
  </g>

  <!-- Foreground Main Typography & Branding (Guaranteed Clear & Prominent) -->
  <g transform="translate(70, 75)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="310" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
    <circle cx="15" cy="15" r="4" fill="#38bdf8" />
    <text x="28" y="19" fill="#7dd3fc" class="banner-mono" font-size="11" font-weight="600" letter-spacing="0.5">RESILIENCE &amp; GRID RELIABILITY</text>

    <!-- Main Title Line 1 -->
    <text x="0" y="85" fill="#ffffff" class="banner-title" font-size="44" letter-spacing="-1">Awesome High Availability</text>
    
    <!-- Main Title Line 2 with Gradient -->
    <text x="0" y="140" fill="url(#primaryGrad)" class="banner-title" font-size="44" letter-spacing="-1">&amp; Test Grid Failover</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="185" fill="#94a3b8" class="banner-sub" font-size="17">
      Curated ecosystem of GSLB, DNS Failover, Anycast Routing &amp; Chaos Engineering
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 225)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" fill="#38bdf8" class="banner-mono" font-size="12">🌐 Multi-Cloud GSLB</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(150, 0)">
        <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" fill="#34d399" class="banner-mono" font-size="12">⚡ Instant Failover</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(300, 0)">
        <rect width="155" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" fill="#c084fc" class="banner-mono" font-size="12">💥 Chaos Validation</text>
      </g>
    </g>
  </g>
</svg>
