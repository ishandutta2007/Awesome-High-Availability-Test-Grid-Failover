yframes pingStatus{0%{r:5;opacity:1}}@keyframes floatCard{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes heartbeat{0%{stroke-width:2;opacity:.8}50%{stroke-width:3.5;opacity:1;filter:drop-shadow(0 0 6px #10b981)}}.orb-anim{animation:pulseOrb 8s ease-in-out infinite alternate;transform-origin:center}.flow-path{stroke-dasharray:8 6;animation:flowLine 2s linear infinite}.ping-ring{animation:pingStatus 2.2s cubic-bezier(0,0,.2,1) infinite}.float-1{animation:floatCard 6s ease-in-out infinite}.heartbeat-line{animation:heartbeat 2.5s ease-in-out infinite}.banner-sub,.banner-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.banner-title{font-weight:800}.banner-sub{font-weight:400}.banner-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><circle cx="150" cy="80" r="140" fill="url(#glowGrad)" class="orb-anim" filter="url(#softGlow)"/><circle cx="1060" cy="340" r="160" fill="#6366f1" class="orb-anim" filter="url(#softGlow)" opacity=".25" style="animation-delay:-3s"/><circle cx="850" cy="100" r="100" fill="#06b6d4" class="orb-anim" filter="url(#softGlow)" opacity=".2" style="animation-delay:-5s"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g class="float-1" transform="translate(680, 50)"><rect width="460" height="310" x="0" y="0" fill="#0f172a" fill-opacity=".75" stroke="#334155" stroke-width="1.2" rx="12"/><g transform="translate(60, 155)"><circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/><text x="0" y="5" fill="#38bdf8" class="banner-mono" font-size="12" font-weight="700" text-anchor="middle">DNS/LB</text><circle cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" class="ping-ring"/></g><path fill="none" stroke="#10b981" stroke-width="2.5" d="M 88 145 C 160 120, 200 80, 290 80" class="flow-path"/><path fill="none" stroke="#6366f1" stroke-das